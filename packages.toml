# Package definitions per distro family.
# Each section lists packages for a (distro, manager) pair.
# Manager is the command used to install: pacman, yay, apt, flatpak, snap, etc.

[arch.pacman]
packages = [
    "discord",
    "steam",
    "keepassxc",
    "syncthing",
    "obs-studio",
    "kitty",
    "btop",
    "zed",
    "distrobox",
    "bat",
    "mpv",
    "obsidian",
    "neovim",
    "pacman-contrib",
    "fastfetch",
    "rate-mirrors",
    "btop",
    "nvtop",
    "ffmpegthumbs",
    "glycin",
    "mangohud",
]

[arch.yay]
packages = [
    "brave-origin-bin",
    "librewolf-bin",
    "protonup-qt",
    "pear-desktop-bin",
    "zoom",
    "ente-auth-bin",
    "namida-bin",
    "lrcget-bin",
    "heroic-games-launcher-bin",
]

[debian.apt]
packages = [
    "discord",
    "steam-installer",
    "keepassxc",
    "syncthing",
    "obs-studio",
    "kitty",
    "btop",
    "zed",
    "lutris",
    "bat",
    "neovim",
    "fastfetch",
]
